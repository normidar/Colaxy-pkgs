name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-fix:
    name: Format & fix check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Run melos format
        run: melos run format

      - name: Run melos fix
        run: melos run fix

      - name: Verify no files changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree changed after 'melos run format' / 'melos run fix'."
            echo "Run both commands locally and commit the result before pushing."
            echo "--- git status ---"
            git status --porcelain
            echo "--- git diff ---"
            git --no-pager diff
            exit 1
          fi
          echo "✅ All files are already formatted and fixed."

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Run melos analyze
        run: melos run analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Run melos test
        run: melos run test
