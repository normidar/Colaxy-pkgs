name: example
description: "An example for Colaxy packages."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  app_info_tile: ^0.3.0
  app_lang_selector: ^0.3.1
  app_theme_picker: ^0.4.1
  colaxy_adaptive_scaffold: ^0.1.0
  colaxy_screenshot: ^0.8.0
  riverpod_helper: ^0.2.1
  cupertino_icons: ^1.0.8
  easy_localization: ^3.0.8
  riverpod_annotation: ^4.0.6
  flutter_riverpod: ^3.4.2
  colaxy_tutorial: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.8
  build_runner: ^2.16.0
  riverpod_lint: ^3.1.8
  colaxy_icons_launcher: ^0.2.0

colaxy_icons_launcher:
  image_path: 'assets/icon.svg'
  platforms:
    android:
      enable: true
    ios:
      enable: true
    web:
      enable: true
    macos:
      enable: true
    windows:
      enable: true
    linux:
      enable: true

flutter:
  uses-material-design: true
  assets:
    - assets/localizations/
resolution: workspace