description: Unified Dart client for Google Play Console and App Store Connect —
  read store reviews and statistics, and reply to reviews, through one API.
dev_dependencies:
  test: ^1.24.0
  very_good_analysis: ^10.3.0
environment:
  sdk: ^3.8.0
