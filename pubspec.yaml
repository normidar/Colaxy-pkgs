name: colaxy_pkgs
description: Root project for Melos
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.11.0 <4.0.0' # pub workspace 機能を使うため 3.5.0 以上が必要

dev_dependencies:
  melos: 8.2.2
  # Needed so the root analysis_options.yaml can `include:` it.
  very_good_analysis: ^10.3.0

workspace:
  - packages/*
  - packages/*/example
  - example

melos:
  packages:
    - packages/**

  command:
    bootstrap:
      usePubspecOverrides: true

  scripts:
    analyze:
      run: melos exec -- dart analyze .
      description: Run dart analyze on all packages.

    format:
      run: melos exec -- dart format .
      description: Run dart format on all packages.

    fix:
      run: melos exec -- dart fix --apply
      description: Run dart fix on all packages.

    # Flutter packages must use `flutter test`; `dart test` cannot load the
    # flutter_test bindings. Pure Dart packages use `dart test`. `melos run
    # test` fans out to both so neither group is silently skipped.
    test:
      run: melos run test:dart && melos run test:flutter
      description: Run tests on all packages (Dart and Flutter).

    test:dart:
      run: melos exec -- dart test
      description: Run tests on pure Dart packages.
      packageFilters:
        dirExists: test
        flutter: false

    test:flutter:
      run: melos exec -- flutter test
      description: Run tests on Flutter packages.
      packageFilters:
        dirExists: test
        flutter: true

    test:coverage:
      run: melos run test:coverage:dart && melos run test:coverage:flutter
      description: Run tests with coverage on all packages.

    test:coverage:dart:
      run: melos exec -- dart test --coverage=coverage
      description: Run tests with coverage on pure Dart packages.
      packageFilters:
        dirExists: test
        flutter: false

    test:coverage:flutter:
      run: melos exec -- flutter test --coverage
      description: Run tests with coverage on Flutter packages.
      packageFilters:
        dirExists: test
        flutter: true

    lint:
      run: melos run analyze && melos run format
      description: Run analyze and format on all packages.

    pub:check:
      run: melos publish
      description: Validate packages and check for any issues before publishing to pub.dev (does not actually upload).

    pub:release:
      run: melos publish --no-dry-run
      description: Publish all updated packages in the workspace to pub.dev.